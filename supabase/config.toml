[project]
ref_id = "ybwbwllmryjdfqvfpcik"
name = "computer-lot-liquidation"
version = "0.1.0"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.pooler]
enabled = true
pool_mode = "transaction"
default_pool_size = 20
max_client_connection = 100

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = false
enable_autoconfirm = true

[storage]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false
