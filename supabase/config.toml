[project]
ref_id = "ybwbwllmryjdfqvfpcik"
name = "computer-lot-liquidation"
version = "0.1.0"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.pooler]
enabled = true
pool_mode = "transaction"
default_pool_size = 20
max_client_connection = 100

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = true
enable_autoconfirm = false

[storage]
enabled = false

[realtime]
# L-R3-3: disabled for LOCAL dev (no realtime server started with `supabase
# start`). The HOSTED project (ybwbwllmryjdfqvfpcik) manages its own Realtime
# and the `supabase_realtime` publication includes orders/products/profiles
# (order_items was dropped 2026-08-02: unused by any client and carries order-
# line pricing PII). The frontend subscribes via supabase-js (useWebSocket.ts)
# purely as refetch triggers for the admin dashboard; all reads are RLS-gated
# and the backend WS broadcasts minimal payloads (M5), so no code change is
# required for hosted; this flag only controls local dev.
enabled = false

[analytics]
enabled = false
